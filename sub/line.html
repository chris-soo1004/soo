<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }
    .line{
      width: 250px;
      height: 30px;
      background-color: #ccc;
      margin: 100px;
      position: relative;
    }
    .line::after{
      content: '';
      display: block;
      width: 70%;
      height: 100%;
      background-color: salmon;
      position: absolute;
      transition: .3s;
    }
    .line:hover::after{
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="line"></div>
  
</body>
</html>
